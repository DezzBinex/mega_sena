<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joga na Mega-Sena</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    >
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Joga na Mega-Sena</h1>

        <input
            id="quantidade"
            type="number"
            min="1"
            max="10"
            value="1"
        >
        
        <button id="botao-sortear" class="btn btn-success">Sortear jogos</button>
        <button id="botao-limpar" class="btn btn-danger">Limpar</button>

        <p id="mensagem"></p>
        <div id="resultado">Seus jogos aparecerão aqui.</div>
    </main>

    <script src="script.js"></script>

</body>
</html>
